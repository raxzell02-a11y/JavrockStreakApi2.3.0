name: Build JavrockStreak

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build dengan Maven
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean package
          elif [ -f "javrock-streak-v2.3/pom.xml" ]; then
            mvn -f javrock-streak-v2.3/pom.xml clean package
          elif [ -f "javrock-streak-v2.2/pom.xml" ]; then
            mvn -f javrock-streak-v2.2/pom.xml clean package
          elif [ -f "javrock-streak-v2.1/pom.xml" ]; then
            mvn -f javrock-streak-v2.1/pom.xml clean package
          elif [ -f "javrock-streak/pom.xml" ]; then
            mvn -f javrock-streak/pom.xml clean package
          else
            echo "pom.xml tidak ditemukan!" && exit 1
          fi

      - name: Upload file JAR
        uses: actions/upload-artifact@v4
        with:
          name: JavrockStreak-JAR
          path: "**/target/JavrockStreak-*.jar"
