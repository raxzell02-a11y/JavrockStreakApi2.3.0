name: Build Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build with Maven
        run: |
          POM_PATH=$(find . -maxdepth 3 -name "pom.xml" | head -n 1)
          if [ -z "$POM_PATH" ]; then
            echo "pom.xml tidak ditemukan!"
            exit 1
          fi
          echo "Menggunakan POM: $POM_PATH"
          mvn -f "$POM_PATH" clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: JavrockStreak-JAR
          path: "**/target/*.jar"
