      name: '&d🔥 &b&lᴅᴜᴏ ꜱᴛʀᴇᴀᴋ'
      lore:
        - '&7ᴍᴏᴅᴇ ꜱᴛʀᴇᴀᴋ ʙᴇʀᴅᴜᴀ 2 ᴘʟᴀʏᴇʀ.'
        - '&7ᴋʟɪᴋ ᴜɴᴛᴜᴋ ᴍᴇʟɪʜᴀᴛ &dʀᴇᴡᴀʀᴅ ᴅᴜᴏ ꜱᴛʀᴇᴀᴋ&7!'
