# Konfigurasi JavrockStreak v2.3.0 untuk Javrock SMP (Paper 1.21.11)
# - /streak reward (atau /streak hadiah) membuka GUI Menu Mode (Solo Streak, Duo Streak, Team Streak).
# - Klik salah satu mode untuk membuka GUI Hadiah Milestone khusus mode tersebut:
#   * Reward Solo Streak
#   * Reward Duo Streak
#   * Team Reward
# - Kombinasi mode: SOLO+TEAM atau DUO+TEAM diperbolehkan, SOLO+DUO tidak boleh bersamaan.

settings:
  # Zona waktu pergantian hari absen harian
  timezone: 'Asia/Jakarta'

  # Jumlah maksimal kesempatan restore per siklus (solo, duo, dan team)
  max-restores: 3

  # Syarat minimal anggota tim di BetterTeams untuk mengaktifkan /streak team api (non-OP)
  min-team-members: 5

  # Waktu kedaluwarsa undangan duo (/streak duo <playername>) dalam detik
  invite-expire-seconds: 60

  # Tampilkan notifikasi otomatis saat pemain login
  notify-on-join: true

gui:
  # Menu utama saat menjalankan /streak reward
  selector:
    title: '&9&lᴊᴀᴠʀᴏᴄᴋ &8» &3ᴘɪʟɪʜ ᴍᴏᴅᴇ ꜱᴛʀᴇᴀᴋ'
    rows: 3
    filler-material: 'GRAY_STAINED_GLASS_PANE'
    solo:
      slot: 11
      icon: 'BLAZE_POWDER'
      name: '&6🔥 &b&lꜱᴏʟᴏ ꜱᴛʀᴇᴀᴋ'
      lore:
        - '&7ᴍᴏᴅᴇ ꜱᴛʀᴇᴀᴋ ɪɴᴅɪᴠɪᴅᴜ 1 ᴘʟᴀʏᴇʀ.'
        - '&7ᴋʟɪᴋ ᴜɴᴛᴜᴋ ᴍᴇʟɪʜᴀᴛ &bʀᴇᴡᴀʀᴅ ꜱᴏʟᴏ ꜱᴛʀᴇᴀᴋ&7!'
        - ''
        - '&8• &3/ꜱᴛʀᴇᴀᴋ ᴀᴘɪ &7- ᴍᴜʟᴀɪ ꜱᴏʟᴏ ꜱᴛʀᴇᴀᴋ'
        - '&8• &3/ꜱᴛʀᴇᴀᴋ ʀᴇꜱᴛᴏʀᴇ &7- ᴘᴜʟɪʜᴋᴀɴ ꜱᴛʀᴇᴀᴋ'
    duo:
