        - '&8• &3/ꜱᴛʀᴇᴀᴋ ᴅᴜᴏ <ᴘʟᴀʏᴇʀ> &7- ᴜɴᴅᴀɴɢ ᴘᴀꜱᴀɴɢᴀɴ'
